name: PHP Microservices

on:
  workflow_call:
    inputs:
      MICROSERVICE:
        required: true
        type: string

      IMAGE:
        required: true
        type: string

      NAMESPACE:
        required: true
        type: string

      RELEASE:
        required: true
        type: string

      WORKING_DIR:
        required: true
        type: string

      DOCKERFILE_PATH:
        required: true
        type: string


env:
  REGISTRY_NAME: robotshopdevacr
  REGISTRY_URL: robotshopdevacr.azurecr.io


jobs:
  test:
    runs-on: robot-shop-runner-azure-dev
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.3"
        extensions: mbstring, curl, pdo_mysql
        coverage: none

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: ~/.composer/cache/files
        key: composer-${{ hashFiles(format('{0}/composer.lock', inputs.WORKING_DIR)) }}
        restore-keys: composer-

    - name: Composer install
      working-directory: ${{ inputs.WORKING_DIR }}
      run: composer install --no-interaction --prefer-dist

    - name: Run PHPUnit tests
      working-directory: ${{ inputs.WORKING_DIR }}
      run: |
        mkdir -p test-results
        vendor/bin/phpunit --testdox --log-junit test-results/junit.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.MICROSERVICE }}-test-results
        path: ${{ inputs.WORKING_DIR }}/test-results

  build:
    runs-on: robot-shop-runner-azure-dev
    needs: test
    outputs:
      IMAGE_TAG: ${{ steps.image.outputs.IMAGE_TAG }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Cloud Credentials
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/setup-cloud-creds@main
      with:
        CLOUD_PROVIDER: azure
        ENVIRONMENT: dev
        APP_SERVICE: acr

    - name: Login to ACR with buildah
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/acr-buildah-login@main
      with:
        REGISTRY_URL: ${{ env.REGISTRY_URL }}
        REGISTRY_NAME: ${{ env.REGISTRY_NAME }}

    - name: Build & Push image with buildah
      id: image
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/buildah-build-push@main
      with:
        IMAGE: ${{ inputs.IMAGE }}
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}
        REGISTRY_URL: ${{ env.REGISTRY_URL }}

  deploy:
    if: ${{ github.ref_name == 'develop' }}
    needs: build
    runs-on: robot-shop-runner-azure-dev
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Helm
      uses: azure/setup-helm@v4.3.0
      with:
        version: 3.9.0

    - name: Prepare helm deployment
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/prepare-helm-deploy@main
      with:
        NAMESPACE: ${{ inputs.NAMESPACE }}

    - name: Deploy helm chart
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/helm-deploy@main
      with:
        RELEASE: ${{ inputs.RELEASE }}
        NAMESPACE: ${{ inputs.NAMESPACE }}
        CHART_PATH: ${{ env.chart_path }}
        IMAGE: ${{ inputs.IMAGE }}:${{ needs.build.outputs.IMAGE_TAG }}
        WORKLOAD_TYPE: deployment