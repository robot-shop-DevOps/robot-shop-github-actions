name: Terraform

on:
  workflow_call:
    inputs:
      CLOUD_PROVIDER:
        required: true
        type: string

      ENVIRONMENT:
        required: true
        type: string

      UPDATE_LOCK_FILE:
        required: false
        default: false
        type: string

      FORCE_UNLOCK:
        required: false
        type: string

      DEPLOY:
        required: true
        type: string

env:
  TF_VERSION: '1.9.8'

jobs:
  terraform:
    runs-on: robot-shop-runner-azure-dev
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup Cloud Credentials
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/setup-cloud-creds@main
      with:
        CLOUD_PROVIDER: ${{ inputs.CLOUD_PROVIDER }}
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        APP_SERVICE: terraform

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Terraform Init
      if : ${{ inputs.UPDATE_LOCK_FILE == 'false' }}
      working-directory: ${{ inputs.CLOUD_PROVIDER }}/${{ inputs.ENVIRONMENT }}
      run: |
        terraform init

    - name: Terraform Init with Lock File Update
      if : ${{ inputs.UPDATE_LOCK_FILE == 'true' }}
      working-directory: ${{ inputs.CLOUD_PROVIDER }}/${{ inputs.ENVIRONMENT }}
      run: |
        terraform init -upgrade
      
    - name: Push lock file to repo
      working-directory: ${{ inputs.CLOUD_PROVIDER }}/${{ inputs.ENVIRONMENT }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .terraform.lock.hcl
        git commit -m "Updated Terraform lock file" || echo "No changes to commit"
        git push || echo "No changes to push"
      
    - name: Terraform Validate
      working-directory: ${{ inputs.CLOUD_PROVIDER }}/${{ inputs.ENVIRONMENT }}
      run: terraform validate
      
    - name: Terraform Force Unlock
      if: ${{ inputs.FORCE_UNLOCK != '' }}
      working-directory: ${{ inputs.CLOUD_PROVIDER }}/${{ inputs.ENVIRONMENT }}
      run: |
        terraform force-unlock -force ${{ inputs.FORCE_UNLOCK }}  

    - name: Terraform Plan
      working-directory: ${{ inputs.CLOUD_PROVIDER }}/${{ inputs.ENVIRONMENT }}
      run: |
        terraform plan -var-file=${{ inputs.ENVIRONMENT }}.tfvars -out=tfplan

    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: ${{ inputs.CLOUD_PROVIDER }}//${{ inputs.ENVIRONMENT }}/tfplan

    - name: Terraform Apply
      if: ${{ inputs.DEPLOY == 'true' && github.ref_name == 'main'}}
      working-directory: ${{ inputs.CLOUD_PROVIDER }}/${{ inputs.ENVIRONMENT }}
      run: terraform apply -auto-approve tfplan