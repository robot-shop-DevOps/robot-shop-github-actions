name: NodeJS Microservices

on:
  workflow_call:
    inputs:
      MICROSERVICE:
        required: true
        type: string

      IMAGE:
        required: true
        type: string

      NAMESPACE:
        required: true
        type: string

      RELEASE:
        required: true
        type: string

      WORKING_DIR:
        required: true
        type: string

      DOCKERFILE_PATH:
        required: true
        type: string

      JEST_JUNIT_OUTPUT_DIR:
        required: false
        type: string
        default: test-results

      JEST_JUNIT_OUTPUT_NAME:
        required: false
        type: string
        default: junit.xml


env:
  REGISTRY_NAME: robotshopdevacr
  REGISTRY_URL: robotshopdevacr.azurecr.io


jobs:
  test:
    runs-on: robot-shop-runner-azure-dev
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ${{ inputs.WORKING_DIR }}/package-lock.json

    - name: Install dependencies
      working-directory: ${{ inputs.WORKING_DIR }}
      run: npm ci

    - name: Run unit tests
      working-directory: ${{ inputs.WORKING_DIR }}
      run: npm run test:ci      
      env:
        JEST_JUNIT_OUTPUT_DIR: ${{ inputs.JEST_JUNIT_OUTPUT_DIR }}
        JEST_JUNIT_OUTPUT_NAME: ${{ inputs.JEST_JUNIT_OUTPUT_NAME }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.MICROSERVICE }}-test-results
        path: ${{ inputs.WORKING_DIR }}/${{ inputs.JEST_JUNIT_OUTPUT_DIR }}

  build:
    runs-on: robot-shop-runner-azure-dev
    needs: test
    outputs:
      IMAGE_TAG: ${{ steps.image.outputs.IMAGE_TAG }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Cloud Credentials
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/setup-cloud-creds@main
      with:
        CLOUD_PROVIDER: azure
        ENVIRONMENT: dev
        APP_SERVICE: acr

    - name: Login to ACR with buildah
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/acr-buildah-login@main
      with:
        REGISTRY_URL: ${{ env.REGISTRY_URL }}
        REGISTRY_NAME: ${{ env.REGISTRY_NAME }}

    - name: Build & Push image with buildah
      id: image
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/buildah-build-push@main
      with:
        IMAGE: ${{ inputs.IMAGE }}
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}
        REGISTRY_URL: ${{ env.REGISTRY_URL }}

  deploy:
    if: ${{ github.ref_name == 'develop' }}
    needs: build
    runs-on: robot-shop-runner-azure-dev
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Helm
      uses: azure/setup-helm@v4.3.0
      with:
        version: 3.9.0

    - name: Prepare helm deployment
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/prepare-helm-deploy@main
      with:
        NAMESPACE: ${{ inputs.NAMESPACE }}

    - name: Deploy helm chart
      uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/helm-deploy@main
      with:
        RELEASE: ${{ inputs.RELEASE }}
        NAMESPACE: ${{ inputs.NAMESPACE }}
        CHART_PATH: ${{ env.chart_path }}
        IMAGE: ${{ inputs.IMAGE }}:${{ needs.build.outputs.IMAGE_TAG }}
        WORKLOAD_TYPE: deployment