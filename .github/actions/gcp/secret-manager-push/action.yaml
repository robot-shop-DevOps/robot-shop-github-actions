name: Push Secret to GCP Secret Manager

description: Create a secret or add a new version to Google Secret Manager

inputs:
  SECRET_NAME:
    description: Name of the GCP Secret Manager secret
    required: true

  SECRET_VALUE:
    description: Secret value to store
    required: true

  PROJECT:
    description: GCP project containing the secret
    required: true

runs:
  using: composite

  steps:
    - name: Push secret
      shell: bash
      run: |
        set -e

        if gcloud secrets describe "${{ inputs.SECRET_NAME }}" \
          --project="${{ inputs.PROJECT }}" > /dev/null 2>&1; then

          echo "Secret '${{ inputs.SECRET_NAME }}' already exists. Adding a new version..."

          echo -n "${{ inputs.SECRET_VALUE }}" | \
          gcloud secrets versions add "${{ inputs.SECRET_NAME }}" \
            --data-file=- \
            --project="${{ inputs.PROJECT }}"

        else

          echo "Secret '${{ inputs.SECRET_NAME }}' does not exist. Creating secret..."

          gcloud secrets create "${{ inputs.SECRET_NAME }}" \
            --replication-policy="automatic" \
            --project="${{ inputs.PROJECT }}"

          echo -n "${{ inputs.SECRET_VALUE }}" | \
          gcloud secrets versions add "${{ inputs.SECRET_NAME }}" \
            --data-file=- \
            --project="${{ inputs.PROJECT }}"

        fi

        echo "Secret '${{ inputs.SECRET_NAME }}' pushed successfully."

        LATEST_VERSION="$(gcloud secrets versions list "${{ inputs.SECRET_NAME }}" \
          --project="${{ inputs.PROJECT }}" \
          --sort-by="~createTime" \
          --limit=1 \
          --format="value(name)")"

        echo "Latest secret version: ${LATEST_VERSION}"